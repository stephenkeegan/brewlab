[project]
name = "brewlab"
version = "0.1.0"
description = "Brewing Digital Twin: physics-based brewing simulation and recipe optimization"
requires-python = ">=3.11"
authors = [{ name = "BrewLab contributors" }]
license = { text = "MIT" }
readme = "README.md"
keywords = ["brewing", "science", "simulation", "optimization", "chemistry"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Chemistry",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.10",
    "mypy>=1.8",
]
sci = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pint>=0.25",
]
gui = [
    "streamlit>=1.30",
    "altair>=5.0",
]

[project.scripts]
brewlab = "brewlab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brewlab"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "PLC", "PD"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_any_generics = true
check_untyped_defs = true
